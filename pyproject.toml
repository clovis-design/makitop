[project]
name = "makitop"
version = "0.1.0"
description = "Logiciel de montage vidéo en Python (R5.A.05 / R5.A.06)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dearpygui>=2.3",
    "av>=14",
    "opencv-python-headless>=4.10",
    "numpy>=2",
    "pillow>=11",
    "sounddevice>=0.5",
    "pedalboard>=0.9",
    "audiomentations>=0.40",
    "moviepy>=2",
]

[project.scripts]
makitop = "makitop.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
